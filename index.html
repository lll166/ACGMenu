                    products: JSON.parse(JSON.stringify(products)),
                    nextId: nextId,
                    currentTemplate: currentTemplate,
                    currentSizePreset: currentSizePreset,
                    columnCount: columnCount,
                    cardGap: cardGap,
                    rowWidth: rowWidth,
                    cardRatio: cardRatio,
                    cardBorderRadius: cardBorderRadius,
                    customColors: Object.assign({}, customColors),
                    colorsOverridden: colorsOverridden,
                    bgImageDataUrl: bgImageDataUrl,
                    bgImageOpacity: bgImageOpacity,
                    qrCodeData: Object.assign({}, qrCodeData),
                    titleText: posterTitle.textContent,
                    subtitleText: posterSubtitle.textContent,
                };
            }

            function restoreState(state) {
                historyLocked = true;
                products = JSON.parse(JSON.stringify(state.products));
                nextId = state.nextId;
                currentTemplate = state.currentTemplate;
                currentSizePreset = state.currentSizePreset || 'custom';
                columnCount = state.columnCount;
                cardGap = state.cardGap;
                rowWidth = state.rowWidth;
                cardRatio = state.cardRatio || 1;
                cardBorderRadius = state.cardBorderRadius || 8;
                customColors = Object.assign({}, state.customColors);
                colorsOverridden = state.colorsOverridden;
                bgImageDataUrl = state.bgImageDataUrl;
                bgImageOpacity = state.bgImageOpacity;
                qrCodeData = Object.assign({}, state.qrCodeData || { url: '', label: '' });
                posterTitle.textContent = state.titleText;
                posterSubtitle.textContent = state.subtitleText;

                templateSelect.value = currentTemplate;
                sizePresetSelect.value = currentSizePreset;
                cardRatioSelect.value = String(cardRatio);
                columnsSlider.value = columnCount;
                columnsValue.textContent = columnCount;
                gapSlider.value = cardGap;
                gapValue.textContent = cardGap;
                rowWidthSlider.value = rowWidth;
                rowWidthValue.textContent = rowWidth;
                borderRadiusSlider.value = cardBorderRadius;
                borderRadiusValue.textContent = cardBorderRadius;
                syncColorPickersToCustom();
                applyTemplateToDOM(currentTemplate, customColors, colorsOverridden);
                updateLayout();
                renderAllProducts();
                if (bgImageDataUrl) {
                    applyBgImage();
                } else {
                    clearBgImageDOM();
                }
                if (qrCodeData.url) {
                    renderQrToPoster();
                }
                updateUndoRedoButtons();
                autoSave();
                historyLocked = false;
            }

            function saveHistory() {
                if (historyLocked) return;
                const state = captureState();
                undoStack.push(state);
                if (undoStack.length > MAX_HISTORY) undoStack.shift();
                redoStack = [];
                updateUndoRedoButtons();
                autoSave();
            }

            function undo() {
                if (undoStack.length === 0) return;
                const currentState = captureState();
                redoStack.push(currentState);
                const prevState = undoStack.pop();
                restoreState(prevState);
                updateUndoRedoButtons();
                showToast('↩ 已撤销');
            }

            function redo() {
                if (redoStack.length === 0) return;
                const currentState = captureState();
                undoStack.push(currentState);
                const nextState = redoStack.pop();
                restoreState(nextState);
                updateUndoRedoButtons();
                showToast('↪ 已重做');
            }

            function updateUndoRedoButtons() {
                btnUndo.disabled = undoStack.length === 0;
                btnRedo.disabled = redoStack.length === 0;
                if (undoStack.length === 0) btnUndo.classList.add('disabled');
                else btnUndo.classList.remove('disabled');
                if (redoStack.length === 0) btnRedo.classList.add('disabled');
                else btnRedo.classList.remove('disabled');
            }

            window.undo = undo;
            window.redo = redo;

            // ==================== localStorage ====================
            const STORAGE_KEY = 'poster-maker-state-v3';
            const CUSTOM_TEMPLATES_KEY = 'poster-maker-custom-templates';

            function autoSave() {
                try {
                    const state = captureState();
                    const json = JSON.stringify(state);
                    if (json.length > 4 * 1024 * 1024) {
                        const stateNoImages = JSON.parse(JSON.stringify(state));
                        stateNoImages.bgImageDataUrl = null;
                        stateNoImages.products = stateNoImages.products.map(p =>
                            Object.assign({}, p, { image: null })
                        );
                        const jsonNoImages = JSON.stringify(stateNoImages);
                        if (jsonNoImages.length < 4 * 1024 * 1024) {
                            localStorage.setItem(STORAGE_KEY, jsonNoImages);
                        }
                    } else {
                        localStorage.setItem(STORAGE_KEY, json);
                    }
                } catch (e) {
                    console.warn('localStorage 保存失败:', e.message);
                }
            }

            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return null;
                    return JSON.parse(raw);
                } catch (e) {
                    return null;
                }
            }

            function loadCustomTemplates() {
                try {
                    const raw = localStorage.getItem(CUSTOM_TEMPLATES_KEY);
                    return raw ? JSON.parse(raw) : [];
                } catch (e) { return []; }
            }

            function saveCustomTemplatesToStorage(templates) {
                try {
                    localStorage.setItem(CUSTOM_TEMPLATES_KEY, JSON.stringify(templates));
                } catch (e) { showToast('⚠️ 保存模板失败'); }
            }

            // ==================== Toast ====================
            let toastTimer;

            function showToast(msg) {
                clearTimeout(toastTimer);
                toast.textContent = msg;
                toast.classList.remove('hidden');
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                    toast.classList.add('hidden');
                }, 1800);
            }

            // ==================== 背景图片管理 ====================
            function triggerBgImageUpload() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.style.display = 'none';
                document.body.appendChild(input);
                let handled = false;
                input.addEventListener('change', (e) => {
                    handled = true;
                    const file = e.target.files[0];
                    if (!file) { document.body.removeChild(input); return; }
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        saveHistory();
                        bgImageDataUrl = ev.target.result;
                        applyBgImage();
                        showToast('🖼 背景图片已导入');
                        document.body.removeChild(input);
                    };
                    reader.readAsDataURL(file);
                });
                input.addEventListener('cancel', () => { handled = true;
                    document.body.removeChild(input); });
                setTimeout(() => { if (!handled && document.body.contains(input)) document.body.removeChild(
                        input); }, 30000);
                input.click();
            }

            function applyBgImage() {
                if (!bgImageDataUrl) return;
                posterBgOverlay.style.backgroundImage = `url('${bgImageDataUrl}')`;
                posterBgOverlay.style.opacity = bgImageOpacity;
                posterBgOverlay.classList.add('visible');
                btnBgUpload.classList.add('has-bg');
                btnBgUpload.textContent = '📁 更换';
                btnBgClear.style.display = 'flex';
                bgOpacitySlider.style.display = 'inline-block';
                bgOpacityValue.style.display = 'inline-block';
                bgOpacitySlider.value = Math.round(bgImageOpacity * 100);
                bgOpacityValue.textContent = Math.round(bgImageOpacity * 100) + '%';
            }

            function clearBgImageDOM() {
                posterBgOverlay.style.backgroundImage = '';
                posterBgOverlay.style.opacity = '0';
                posterBgOverlay.classList.remove('visible');
                btnBgUpload.classList.remove('has-bg');
                btnBgUpload.textContent = '📁 导入';
                btnBgClear.style.display = 'none';
                bgOpacitySlider.style.display = 'none';
                bgOpacityValue.style.display = 'none';
            }

            function clearBgImage() {
                saveHistory();
                bgImageDataUrl = null;
                clearBgImageDOM();
                showToast('🗑 背景图片已清除');
            }

            function updateBgOpacity(value) {
                bgImageOpacity = parseInt(value) / 100;
                posterBgOverlay.style.opacity = bgImageOpacity;
                bgOpacityValue.textContent = value + '%';
                autoSave();
            }

            window.triggerBgImageUpload = triggerBgImageUpload;
            window.clearBgImage = clearBgImage;

            // ==================== 应用模板 ====================
            function applyTemplateToDOM(tplName, colors, overridden) {
                const tpl = TEMPLATES[tplName];
                if (!tpl) return;
                const root = posterContainer.style;
                root.setProperty('--poster-bg', colors.bg);
                root.setProperty('--card-bg', colors.card);
                root.setProperty('--text', colors.text);
                root.setProperty('--text-secondary', tpl.textSecondary);
                root.setProperty('--accent', colors.accent);
                root.setProperty('--border', tpl.border);
                root.setProperty('--price-color', colors.price);
                root.setProperty('--title-color', colors.title);
                root.setProperty('--subtitle-color', colors.subtitle);
                root.setProperty('--card-radius', tpl.cardRadius);
                root.setProperty('--card-shadow', tpl.cardShadow);
                root.setProperty('--card-border', tpl.cardBorder);
                root.setProperty('--tag-bg', tpl.tagBg);
                root.setProperty('--tag-text', tpl.tagText);
                root.setProperty('--badge-bg', tpl.badgeBg);
                root.setProperty('--badge-text', tpl.badgeText);
                root.setProperty('--deco-color', tpl.decoColor);
                root.setProperty('--poster-border', tpl.posterBorder);
                root.setProperty('--corner-deco', '"' + tpl.cornerDeco + '"');
                root.setProperty('--font-title', tpl.fontTitle);
                root.setProperty('--font-body', tpl.fontBody);
                root.setProperty('--font-price', tpl.fontPrice);
                root.setProperty('--image-area-bg', tpl.imageAreaBg || '#eaeaea');
                root.setProperty('--card-border-radius', cardBorderRadius + 'px');
                root.setProperty('--card-ratio', cardRatio);
                if (!overridden) syncColorPickersToCustom();
                if (bgImageDataUrl) applyBgImage();
            }

            function applyTemplate(tplName, keepColors) {
                const tpl = TEMPLATES[tplName];
                if (!tpl) return;
                currentTemplate = tplName;
                if (!keepColors) {
                    colorsOverridden = false;
                    customColors.bg = tpl.posterBg;
                    customColors.card = tpl.cardBg;
                    customColors.text = tpl.text;
                    customColors.accent = tpl.accent;
                    customColors.price = tpl.priceColor;
                    customColors.title = tpl.titleColor;
                    customColors.subtitle = tpl.subtitleColor || tpl.textSecondary;
                }
                if (keepColors) colorsOverridden = true;
                applyTemplateToDOM(tplName, customColors, colorsOverridden);
            }

            function syncColorPickersToCustom() {
                colorBg.value = customColors.bg;
                colorCard.value = customColors.card;
                colorText.value = customColors.text;
                colorAccent.value = customColors.accent;
                colorPrice.value = customColors.price;
                colorTitle.value = customColors.title;
                colorSubtitle.value = customColors.subtitle;
            }

            function applyCustomColor(which, value) {
                saveHistory();
                colorsOverridden = true;
                customColors[which] = value;
                const map = {
                    bg: '--poster-bg',
                    card: '--card-bg',
                    text: '--text',
                    accent: '--accent',
                    price: '--price-color',
                    title: '--title-color',
                    subtitle: '--subtitle-color',
                };
                posterContainer.style.setProperty(map[which], value);
                autoSave();
            }

            // ==================== 应用尺寸预设 ====================
            function applySizePreset(presetKey) {
                const preset = SIZE_PRESETS[presetKey];
                if (!preset || presetKey === 'custom') {
                    currentSizePreset = 'custom';
                    return;
                }
                currentSizePreset = presetKey;
                if (preset.width) rowWidth = preset.width;
                if (preset.cols) columnCount = preset.cols;
                if (preset.ratio !== null && preset.ratio !== undefined) cardRatio = preset.ratio;
                if (preset.gap) cardGap = preset.gap;

                rowWidthSlider.value = rowWidth;
                rowWidthValue.textContent = rowWidth;
                columnsSlider.value = columnCount;
                columnsValue.textContent = columnCount;
                gapSlider.value = cardGap;
                gapValue.textContent = cardGap;
                cardRatioSelect.value = String(cardRatio);

                posterContainer.style.setProperty('--card-ratio', cardRatio);
                updateLayout();
                renderAllProducts();
            }

            // ==================== 更新布局 ====================
            function updateLayout() {
                columnCount = parseInt(columnsSlider.value);
                cardGap = parseInt(gapSlider.value);
                rowWidth = parseInt(rowWidthSlider.value);
                cardBorderRadius = parseInt(borderRadiusSlider.value);
                cardRatio = parseFloat(cardRatioSelect.value);
                columnsValue.textContent = columnCount;
                gapValue.textContent = cardGap;
                rowWidthValue.textContent = rowWidth;
                borderRadiusValue.textContent = cardBorderRadius;

                posterContainer.style.maxWidth = rowWidth + 'px';
                posterContainer.style.setProperty('--card-border-radius', cardBorderRadius + 'px');
                posterContainer.style.setProperty('--card-ratio', cardRatio);
                productsGrid.style.gridTemplateColumns = `repeat(${columnCount}, 1fr)`;
                productsGrid.style.gap = cardGap + 'px';
            }

            // ==================== 渲染产品卡片 ====================
            function renderAllProducts() {
                productsGrid.innerHTML = '';

                products.forEach((prod, index) => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.setAttribute('data-id', prod.id);
                    card.setAttribute('data-index', index);
                    card.draggable = true;

                    // 角标
                    let badgeHTML = '';
                    if (prod.badge && prod.badge.trim()) {
                        badgeHTML =
                            `<div class="card-badge" data-action="edit-badge" data-id="${prod.id}" title="点击编辑角标">${escapeHTML(prod.badge)}</div>`;
                    } else {
                        badgeHTML =
                            `<div class="card-badge" data-action="edit-badge" data-id="${prod.id}" title="点击添加角标" style="background:transparent;color:#aaa;opacity:0.6;border:1px dashed #ccc;">+</div>`;
                    }

                    // 图片
                    const hasImage = prod.image && prod.image.trim();
                    const imgContentHTML = hasImage ?
                        `<div class="card-image-bg" style="background-image: url('${prod.image}');"></div>` :
                        '';
                    const placeholderHTML = hasImage ?
                        '' :
                        `<div class="card-image-placeholder"><span class="icon-upload">📷</span><span>点击上传</span></div>`;

                    // 多标签
                    const rawTags = prod.tag || '';
                    const tagList = rawTags.split(/[,，]/).map(t => t.trim()).filter(Boolean);
                    let tagsHTML = '';
                    if (tagList.length > 0) {
                        tagsHTML = tagList.map(t =>
                            `<span class="card-tag" data-action="edit-tag" data-id="${prod.id}" title="点击编辑标签">${escapeHTML(t)}</span>`
                        ).join('');
                    } else {
                        tagsHTML =
                            `<span class="card-tag placeholder-tag" data-action="edit-tag" data-id="${prod.id}" title="点击添加标签">+ 标签</span>`;
                    }
                    const tagsRowHTML = `<div class="card-tags-row">${tagsHTML}</div>`;

                    // 描述
                    const descText = prod.description || '';
                    const descHTML = descText ?
                        `<div class="card-description" data-action="edit-description" data-id="${prod.id}" title="点击编辑描述">${escapeHTML(descText)}</div>` :
                        `<div class="card-description empty-desc" data-action="edit-description" data-id="${prod.id}" title="点击添加描述">+ 添加描述</div>`;

                    card.innerHTML = `
                        ${badgeHTML}
                        <div class="card-actions">
                            <button class="btn-upload-card" title="上传图片">🖼</button>
                            <button class="btn-copy-card" title="复制商品">📋</button>
                            <button class="btn-del-card" title="删除商品">✕</button>
                        </div>
                        <div class="card-image-area ${hasImage ? 'has-image' : ''}">
                            ${imgContentHTML}
                            ${placeholderHTML}
                        </div>
                        <div class="card-info">
                            <div class="card-name" data-action="edit-name" data-id="${prod.id}">${escapeHTML(prod.name)}</div>
                            ${descHTML}
                            ${tagsRowHTML}
                            <div class="card-price" data-action="edit-price" data-id="${prod.id}">${escapeHTML(prod.price)}</div>
                        </div>
                    `;

                    // 图片点击
                    const imgArea = card.querySelector('.card-image-area');
                    imgArea.addEventListener('click', (e) => { e.stopPropagation();
                        triggerImageUpload(prod.id); });

                    // 名称编辑
                    card.querySelector('.card-name').addEventListener('click', (e) => { e.stopPropagation();
                        editInline(card.querySelector('.card-name'), 'name', prod.id); });
                    // 价格编辑
                    card.querySelector('.card-price').addEventListener('click', (e) => { e.stopPropagation();
                        editInline(card.querySelector('.card-price'), 'price', prod.id); });
                    // 描述编辑
                    const descEl = card.querySelector('.card-description');
                    if (descEl) descEl.addEventListener('click', (e) => { e.stopPropagation();
                        editInline(descEl, 'description', prod.id); });

                    // 标签编辑（点击任意 tag 编辑整组标签）
                    const tagEls = card.querySelectorAll('.card-tag');
                    tagEls.forEach(tagEl => {
                        tagEl.addEventListener('click', (e) => { e.stopPropagation();
                            editInline(tagEl, 'tag', prod.id); });
                    });

                    // 角标编辑
                    const badgeEl = card.querySelector('.card-badge');
                    if (badgeEl) badgeEl.addEventListener('click', (e) => { e.stopPropagation();
                        editInline(badgeEl, 'badge', prod.id); });

                    // 操作按钮
                    card.querySelector('.btn-upload-card').addEventListener('click', (e) => { e.stopPropagation();
                        triggerImageUpload(prod.id); });
                    card.querySelector('.btn-copy-card').addEventListener('click', (e) => { e.stopPropagation();
                        duplicateProduct(prod.id); });
                    card.querySelector('.btn-del-card').addEventListener('click', (e) => { e.stopPropagation();
                        deleteProduct(prod.id); });

                    // 桌面拖拽
                    card.addEventListener('dragstart', handleDragStart);
                    card.addEventListener('dragover', handleDragOver);
                    card.addEventListener('dragenter', handleDragEnter);
                    card.addEventListener('dragleave', handleDragLeave);
                    card.addEventListener('drop', handleDrop);
                    card.addEventListener('dragend', handleDragEnd);

                    // 移动端触摸拖拽
                    card.addEventListener('touchstart', handleTouchStart, { passive: false });
                    card.addEventListener('touchmove', handleTouchMove, { passive: false });
                    card.addEventListener('touchend', handleTouchEnd);

                    productsGrid.appendChild(card);
                });

                // 添加占位按钮
                const addPlaceholder = document.createElement('div');
                addPlaceholder.className = 'add-card-placeholder';
                addPlaceholder.innerHTML = '<span>＋</span><span>添加商品</span>';
                addPlaceholder.addEventListener('click', () => addProduct());
                productsGrid.appendChild(addPlaceholder);

                if (bgImageDataUrl) applyBgImage();
                updateLayout();
                if (qrCodeData.url) renderQrToPoster();
            }

            function escapeHTML(str) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
                return String(str).replace(/[&<>"']/g, c => map[c]);
            }

            // ==================== 内联编辑 ====================
            function editInline(element, field, productId) {
                if (element.querySelector('input')) return;
                const prod = products.find(p => p.id === productId);
                if (!prod) return;
                const originalText = prod[field] || '';

                saveHistory();

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'inline-edit-input';
                input.value = originalText;
                input.style.width = '100%';
                input.style.minWidth = '60px';

                if (field === 'tag') {
                    input.style.fontSize = '10px';
                    input.style.padding = '2px 6px';
                    input.style.letterSpacing = '1px';
                    input.style.fontWeight = '600';
                }
                if (field === 'badge') {
                    input.style.fontSize = '10px';
                    input.style.padding = '2px 6px';
                    input.style.letterSpacing = '1px';
                    input.style.fontWeight = '700';
                }
                if (field === 'description') {
                    input.style.fontSize = '11px';
                    input.style.padding = '2px 6px';
                }

                element.textContent = '';
                element.appendChild(input);
                input.focus();
                input.select();

                const save = () => {
                    let newVal = input.value.trim();
                    if (field === 'badge' || field === 'tag' || field === 'description') {
                        prod[field] = newVal;
                    } else {
                        prod[field] = newVal || originalText;
                    }
                    input.remove();
                    renderAllProducts();
                    autoSave();
                };

                input.addEventListener('blur', save);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') input.blur();
                    if (e.key === 'Escape') { input.value = originalText;
                        input.blur(); }
                });
            }

            // ==================== 图片上传 ====================
            function triggerImageUpload(productId) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.style.display = 'none';
                document.body.appendChild(input);
                let handled = false;
                input.addEventListener('change', (e) => {
                    handled = true;
                    const file = e.target.files[0];
                    if (!file) { document.body.removeChild(input); return; }
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        saveHistory();
                        const prod = products.find(p => p.id === productId);
                        if (prod) { prod.image = ev.target.result;
                            renderAllProducts();
                            showToast('✅ 图片已上传'); }
                        document.body.removeChild(input);
                    };
                    reader.readAsDataURL(file);
                });
                input.addEventListener('cancel', () => { handled = true;
                    document.body.removeChild(input); });
                setTimeout(() => { if (!handled && document.body.contains(input)) document.body.removeChild(
                        input); }, 30000);
                input.click();
            }

            window.triggerImageUpload = triggerImageUpload;

            // ==================== 添加/删除/复制商品 ====================
            function addProduct() {
                saveHistory();
                const newProd = { id: nextId++, name: '新商品名称', price: '¥000', image: null, tag: '', badge: '',
                    description: '' };
                products.push(newProd);
                renderAllProducts();
                showToast('➕ 已添加新商品');
            }

            function deleteProduct(productId) {
                if (products.length <= 1) { showToast('⚠️ 至少保留一个商品'); return; }
                saveHistory();
                products = products.filter(p => p.id !== productId);
                renderAllProducts();
                showToast('🗑 已删除商品');
            }

            function duplicateProduct(productId) {
                saveHistory();
                const source = products.find(p => p.id === productId);
                if (!source) return;
                const clone = JSON.parse(JSON.stringify(source));
                clone.id = nextId++;
                clone.name = source.name + ' (副本)';
                products.push(clone);
                renderAllProducts();
                showToast('📋 已复制商品');
            }

            function resetAll() {
                saveHistory();
                products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
                nextId = 5;
                colorsOverridden = false;
                currentTemplate = 'monochrome';
                currentSizePreset = 'custom';
                columnCount = 3;
                cardGap = 16;
                rowWidth = 900;
                cardRatio = 1;
                cardBorderRadius = 8;
                templateSelect.value = 'monochrome';
                sizePresetSelect.value = 'custom';
                cardRatioSelect.value = '1';
                columnsSlider.value = 3;
                gapSlider.value = 16;
                rowWidthSlider.value = 900;
                borderRadiusSlider.value = 8;
                columnsValue.textContent = '3';
                gapValue.textContent = '16';
                rowWidthValue.textContent = '900';
                borderRadiusValue.textContent = '8';
                posterTitle.textContent = '✦ 商 品 贩 售 ✦';
                posterSubtitle.textContent = '— 这里是小标题 —';
                bgImageDataUrl = null;
                bgImageOpacity = 0.15;
                qrCodeData = { url: '', label: '' };
                clearBgImageDOM();
                posterQrArea.style.display = 'none';
                posterQrArea.innerHTML = '';
                btnQrCode.classList.remove('has-qr');
                applyTemplate('monochrome', false);
                syncColorPickersToCustom();
                posterContainer.style.setProperty('--card-border-radius', '8px');
                posterContainer.style.setProperty('--card-ratio', '1');
                renderAllProducts();
                updateLayout();
                redoStack = [];
                updateUndoRedoButtons();
                autoSave();
                showToast('↺ 已恢复默认设置');
            }

            window.addProduct = addProduct;
            window.deleteProduct = deleteProduct;
            window.resetAll = resetAll;

            // ==================== 桌面端拖拽 ====================
            let dragSrcIndex = null;

            function handleDragStart(e) {
                dragSrcIndex = parseInt(this.getAttribute('data-index'));
                this.classList.add('drag-source');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', dragSrcIndex);
            }

            function handleDragOver(e) { e.preventDefault();
                e.dataTransfer.dropEffect = 'move'; }

            function handleDragEnter(e) {
                e.preventDefault();
                if (parseInt(this.getAttribute('data-index')) !== dragSrcIndex) this.classList.add('drag-over');
            }

            function handleDragLeave(e) { this.classList.remove('drag-over'); }

            function handleDrop(e) {
                e.preventDefault();
                this.classList.remove('drag-over');
                const targetIndex = parseInt(this.getAttribute('data-index'));
                if (dragSrcIndex !== null && targetIndex !== null && dragSrcIndex !== targetIndex) {
                    saveHistory();
                    const moved = products.splice(dragSrcIndex, 1)[0];
                    products.splice(targetIndex, 0, moved);
                    renderAllProducts();
                    showToast('🔄 排序已更新');
                }
                dragSrcIndex = null;
            }

            function handleDragEnd(e) {
                this.classList.remove('drag-source');
                document.querySelectorAll('.product-card').forEach(c => c.classList.remove('drag-over'));
                dragSrcIndex = null;
            }

            // ==================== 移动端触摸拖拽 ====================
            let touchData = { card: null, clone: null, startX: 0, startY: 0, index: -1, currentTarget: null,
                isDragging: false, hasMoved: false };

            function handleTouchStart(e) {
                if (e.target.closest('input, button, .card-image-area, .card-name, .card-price, .card-tag, .card-badge, .card-description'))
                    return;
                const card = e.target.closest('.product-card');
                if (!card) return;
                const touch = e.touches[0];
                touchData.card = card;
                touchData.startX = touch.clientX;
                touchData.startY = touch.clientY;
                touchData.index = parseInt(card.getAttribute('data-index'));
                touchData.isDragging = false;
                touchData.hasMoved = false;
                touchData.currentTarget = null;
            }

            function handleTouchMove(e) {
                if (!touchData.card) return;
                const touch = e.touches[0];
                const dx = touch.clientX - touchData.startX;
                const dy = touch.clientY - touchData.startY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (!touchData.isDragging && dist < 10) return;
                if (!touchData.isDragging) {
                    touchData.isDragging = true;
                    touchData.hasMoved = true;
                    const card = touchData.card;
                    const clone = card.cloneNode(true);
                    const rect = card.getBoundingClientRect();
                    clone.classList.add('touch-drag-clone');
                    clone.style.width = rect.width + 'px';
                    clone.style.height = rect.height + 'px';
                    clone.style.left = rect.left + 'px';
                    clone.style.top = rect.top + 'px';
                    document.body.appendChild(clone);
                    touchData.clone = clone;
                    card.classList.add('touch-dragging');
                }
                e.preventDefault();
                const clone = touchData.clone;
                clone.style.left = (touch.clientX - clone.offsetWidth / 2) + 'px';
                clone.style.top = (touch.clientY - clone.offsetHeight / 2) + 'px';
                const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                const cardBelow = elemBelow ? elemBelow.closest('.product-card') : null;
                if (touchData.currentTarget && touchData.currentTarget !== cardBelow) {
                    touchData.currentTarget.classList.remove('drag-over');
                    touchData.currentTarget = null;
                }
                if (cardBelow && cardBelow !== touchData.card && cardBelow !== touchData.currentTarget) {
                    cardBelow.classList.add('drag-over');
                    touchData.currentTarget = cardBelow;
                }
            }

            function handleTouchEnd(e) {
                if (!touchData.card) return;
                if (touchData.clone) { document.body.removeChild(touchData.clone);
                    touchData.clone = null; }
                touchData.card.classList.remove('touch-dragging');
                if (touchData.currentTarget) {
                    touchData.currentTarget.classList.remove('drag-over');
                    const targetIndex = parseInt(touchData.currentTarget.getAttribute('data-index'));
                    if (targetIndex !== touchData.index && targetIndex >= 0 && touchData.index >= 0) {
                        saveHistory();
                        const moved = products.splice(touchData.index, 1)[0];
                        products.splice(targetIndex, 0, moved);
                        renderAllProducts();
                        showToast('🔄 排序已更新');
                    }
                }
                touchData = { card: null, clone: null, startX: 0, startY: 0, index: -1, currentTarget: null,
                    isDragging: false, hasMoved: false };
            }

            // ==================== 模板切换确认弹窗 ====================
            let pendingTemplate = null;

            function showTemplateConfirm(tplName) { pendingTemplate = tplName;
                templateConfirmModal.style.display = 'flex'; }

            function hideTemplateConfirm() { pendingTemplate = null;
                templateConfirmModal.style.display = 'none'; }

            document.getElementById('btnKeepColors').addEventListener('click', () => {
                if (pendingTemplate) {
                    saveHistory();
                    applyTemplate(pendingTemplate, true);
                    renderAllProducts();
                    showToast(`🎨 已切换至「${TEMPLATES[pendingTemplate].name}」模板（保留配色）`);
                }
                hideTemplateConfirm();
            });
            document.getElementById('btnOverrideColors').addEventListener('click', () => {
                if (pendingTemplate) {
                    saveHistory();
                    applyTemplate(pendingTemplate, false);
                    renderAllProducts();
                    showToast(`🎨 已切换至「${TEMPLATES[pendingTemplate].name}」模板`);
                }
                hideTemplateConfirm();
            });
            templateConfirmModal.addEventListener('click', (e) => { if (e.target === templateConfirmModal)
                    hideTemplateConfirm(); });

            // ==================== 批量导入弹窗 ====================
            function openBatchImport() { batchImportText.value = '';
                batchImportModal.style.display = 'flex';
                setTimeout(() => batchImportText.focus(), 150); }

            function closeBatchImport() { batchImportModal.style.display = 'none';
                batchImportText.value = ''; }

            function executeBatchImport() {
                const raw = batchImportText.value.trim();
                if (!raw) { showToast('⚠️ 请输入商品数据'); return; }
                const lines = raw.split(/\n/).filter(line => line.trim());
                const newProducts = [];
                for (const line of lines) {
                    let parts;
                    if (line.includes('\t')) parts = line.split('\t');
                    else if (line.includes(',')) parts = line.split(',');
                    else parts = [line];
                    const name = (parts[0] || '').trim();
                    if (!name) continue;
                    const price = (parts[1] || '').trim() || '¥000';
                    const tag = (parts[2] || '').trim();
                    const description = (parts[3] || '').trim();
                    newProducts.push({ id: nextId++, name, price, image: null, tag, badge: '', description });
                }
                if (newProducts.length === 0) { showToast('⚠️ 未识别到有效数据'); return; }
                saveHistory();
                products = products.concat(newProducts);
                closeBatchImport();
                renderAllProducts();
                showToast(`📋 已导入 ${newProducts.length} 个商品`);
            }

            window.openBatchImport = openBatchImport;
            window.closeBatchImport = closeBatchImport;
            window.executeBatchImport = executeBatchImport;
            batchImportModal.addEventListener('click', (e) => { if (e.target === batchImportModal) closeBatchImport(); });

            // ==================== 二维码弹窗 ====================
            function openQrModal() {
                qrUrlInput.value = qrCodeData.url || '';
                qrModal.style.display = 'flex';
                if (qrCodeData.url) btnClearQr.style.display = 'flex';
                else btnClearQr.style.display = 'none';
                setTimeout(() => qrUrlInput.focus(), 150);
            }

            function closeQrModal() { qrModal.style.display = 'none'; }

            function generateQrCode() {
                const url = qrUrlInput.value.trim();
                if (!url) { showToast('⚠️ 请输入链接地址'); return; }
                saveHistory();
                qrCodeData = { url, label: '扫码访问' };
                renderQrToPoster();
                closeQrModal();
                showToast('🔗 二维码已生成');
            }

            function clearQrCode() {
                saveHistory();
                qrCodeData = { url: '', label: '' };
                posterQrArea.style.display = 'none';
                posterQrArea.innerHTML = '';
                btnQrCode.classList.remove('has-qr');
                btnClearQr.style.display = 'none';
                showToast('🗑 二维码已清除');
            }

            function renderQrToPoster() {
                if (!qrCodeData.url) return;
                posterQrArea.style.display = 'flex';
                posterQrArea.innerHTML =
                    '<div class="qr-container"><div id="qrCodeTarget"></div><span class="qr-label" title="点击编辑标签">' +
                    escapeHTML(qrCodeData.label) + '</span></div>';

                // 生成 QR
                const target = document.getElementById('qrCodeTarget');
                if (target && typeof QRCode !== 'undefined') {
                    new QRCode(target, {
                        text: qrCodeData.url,
                        width: 80,
                        height: 80,
                        colorDark: '#1a1a1a',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.M,
                    });
                }

                btnQrCode.classList.add('has-qr');
                btnClearQr.style.display = 'flex';

                // 标签编辑
                const labelEl = posterQrArea.querySelector('.qr-label');
                if (labelEl) {
                    labelEl.addEventListener('click', () => {
                        const current = qrCodeData.label;
                        const input = document.createElement('input');
                        input.type = 'text';
                        input.className = 'inline-edit-input';
                        input.value = current;
                        input.style.fontSize = '9px';
                        input.style.textAlign = 'center';
                        input.style.maxWidth = '80px';
                        labelEl.textContent = '';
                        labelEl.appendChild(input);
                        input.focus();
                        input.select();
                        const save = () => {
                            saveHistory();
                            qrCodeData.label = input.value.trim() || current;
                            input.remove();
                            renderQrToPoster();
                            autoSave();
                        };
                        input.addEventListener('blur', save);
                        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); if (e
                                .key === 'Escape') { input.value = current;
                                input.blur(); } });
                    });
                }
            }

            window.openQrModal = openQrModal;
            window.closeQrModal = closeQrModal;
            window.generateQrCode = generateQrCode;
            window.clearQrCode = clearQrCode;
            qrModal.addEventListener('click', (e) => { if (e.target === qrModal) closeQrModal(); });

            // ==================== 打印 ====================
            function printPoster() {
                showToast('🖨 正在准备打印...');
                setTimeout(() => window.print(), 300);
            }
            window.printPoster = printPoster;

            // ==================== 保存自定义模板 ====================
            function saveCustomTemplate() {
                const name = prompt('请输入自定义模板名称：', '我的配色');
                if (!name || !name.trim()) return;
                const template = { name: name.trim(), colors: Object.assign({}, customColors) };
                const customTemplates = loadCustomTemplates();
                const existingIdx = customTemplates.findIndex(t => t.name === template.name);
                if (existingIdx >= 0) {
                    if (!confirm(`模板「${template.name}」已存在，是否覆盖？`)) return;
                    customTemplates[existingIdx] = template;
                } else {
                    customTemplates.push(template);
                }
                saveCustomTemplatesToStorage(customTemplates);
                refreshTemplateSelect();
                showToast(`💾 模板「${template.name}」已保存`);
            }

            function refreshTemplateSelect() {
                const customTemplates = loadCustomTemplates();
                const builtInCount = Object.keys(TEMPLATES).length;
                while (templateSelect.options.length > builtInCount + 1) templateSelect.remove(templateSelect.options
                    .length - 1);
                for (let i = templateSelect.options.length - 1; i >= 0; i--) {
                    if (templateSelect.options[i].value.startsWith('custom_') || templateSelect.options[i].value ===
                        '__sep__') templateSelect.remove(i);
                }
                if (customTemplates.length > 0) {
                    const sep = document.createElement('option');
                    sep.value = '__sep__';
                    sep.textContent = '──────────';
                    sep.disabled = true;
                    templateSelect.appendChild(sep);
                    customTemplates.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = 'custom_' + t.name;
                        opt.textContent = '💾 ' + t.name;
                        templateSelect.appendChild(opt);
                    });
                }
                templateSelect.value = currentTemplate;
            }
            window.saveCustomTemplate = saveCustomTemplate;

            // ==================== 导出 ====================
            async function exportImage(format) {
                const ext = format === 'png' ? 'png' : 'jpg';
                const mime = format === 'png' ? 'image/png' : 'image/jpeg';
                const quality = format === 'png' ? 1.0 : 0.95;
                showToast(`📸 正在生成${ext.toUpperCase()}图片...`);

                const bgDivs = posterContainer.querySelectorAll('.card-image-bg');
                const loadPromises = Array.from(bgDivs).map(div => {
                    const bg = div.style.backgroundImage;
                    if (!bg || bg === 'none') return Promise.resolve();
                    const url = bg.replace(/url\(['"]?/, '').replace(/['"]?\)/, '');
                    const img = new Image();
                    img.src = url;
                    return new Promise(resolve => { if (img.complete) resolve();
                        else { img.addEventListener('load', resolve);
                            img.addEventListener('error', resolve); } });
                });
                if (bgImageDataUrl && posterBgOverlay.classList.contains('visible')) {
                    const bgImg = new Image();
                    bgImg.src = bgImageDataUrl;
                    loadPromises.push(new Promise(resolve => { if (bgImg.complete) resolve();
                        else { bgImg.addEventListener('load', resolve);
                            bgImg.addEventListener('error', resolve); } }));
                }
                await Promise.all(loadPromises);
                await new Promise(r => setTimeout(r, 400));

                try {
                    const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
                    const canvas = await html2canvas(posterContainer, {
                        backgroundColor: format === 'png' ? null : '#ffffff',
                        scale: dpr,
                        useCORS: true,
                        allowTaint: true,
                        logging: false,
                    });
                    const link = document.createElement('a');
                    link.download = `anime-merch-poster_${Date.now()}.${ext}`;
                    link.href = canvas.toDataURL(mime, quality);
                    link.click();
                    showToast(`✅ ${ext.toUpperCase()}导出成功！`);
                } catch (err) {
                    console.error('导出失败:', err);
                    showToast('❌ 导出失败，请重试');
                }
            }
            window.exportImage = exportImage;

            // ==================== 标题编辑 ====================
            function setupTitleEditor(el) {
                el.addEventListener('click', () => {
                    const current = el.textContent;
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'inline-edit-input';
                    input.value = current;
                    input.style.textAlign = 'center';
                    if (el === posterTitle) {
                        input.style.fontSize = '26px';
                        input.style.fontWeight = '700';
                        input.style.letterSpacing = '3px';
                        input.style.maxWidth = '400px';
                    } else {
                        input.style.fontSize = '12px';
                        input.style.letterSpacing = '2px';
                        input.style.maxWidth = '350px';
                    }
                    el.textContent = '';
                    el.appendChild(input);
                    input.focus();
                    input.select();
                    const save = () => { saveHistory();
                        el.textContent = input.value.trim() || current;
                        input.remove();
                        autoSave(); };
                    input.addEventListener('blur', save);
                    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); if (e.key ===
                            'Escape') { input.value = current;
                            input.blur(); } });
                });
            }
            setupTitleEditor(posterTitle);
            setupTitleEditor(posterSubtitle);

            // ==================== 事件监听 ====================
            templateSelect.addEventListener('change', () => {
                const val = templateSelect.value;
                if (val === '__sep__') return;
                if (val.startsWith('custom_')) {
                    const templateName = val.substring(7);
                    const customTemplates = loadCustomTemplates();
                    const ct = customTemplates.find(t => t.name === templateName);
                    if (ct) {
                        saveHistory();
                        currentTemplate = val;
                        colorsOverridden = true;
                        customColors = Object.assign({}, ct.colors);
                        applyTemplateToDOM('monochrome', customColors, true);
                        renderAllProducts();
                        showToast(`💾 已加载自定义模板「${templateName}」`);
                    }
                    return;
                }
                if (colorsOverridden && customColorsHaveChanged(val)) {
                    showTemplateConfirm(val);
                } else {
                    saveHistory();
                    applyTemplate(val, false);
                    renderAllProducts();
                    showToast(`🎨 已切换至「${TEMPLATES[val].name}」模板`);
                }
            });

            function customColorsHaveChanged(tplName) {
                const tpl = TEMPLATES[tplName];
                if (!tpl) return false;
                const keys = [
                    { custom: 'bg', tpl: 'posterBg' }, { custom: 'card', tpl: 'cardBg' },
                    { custom: 'text', tpl: 'text' }, { custom: 'accent', tpl: 'accent' },
                    { custom: 'price', tpl: 'priceColor' }, { custom: 'title', tpl: 'titleColor' },
                    { custom: 'subtitle', tpl: 'subtitleColor' },
                ];
                for (const k of keys) {
                    if (customColors[k.custom].toLowerCase() !== (tpl[k.tpl] || '').toLowerCase()) return true;
                }
                return false;
            }

            sizePresetSelect.addEventListener('change', () => {
                const val = sizePresetSelect.value;
                if (val === 'custom') {
                    currentSizePreset = 'custom';
                    showToast('🖐 已切换为自定义尺寸');
                    return;
                }
                saveHistory();
                applySizePreset(val);
                renderAllProducts();
                showToast(`📱 已切换至「${SIZE_PRESETS[val].name}」尺寸`);
            });

            cardRatioSelect.addEventListener('change', () => {
                saveHistory();
                cardRatio = parseFloat(cardRatioSelect.value);
                posterContainer.style.setProperty('--card-ratio', cardRatio);
                // 解除尺寸预设
                currentSizePreset = 'custom';
                sizePresetSelect.value = 'custom';
                renderAllProducts();
                autoSave();
                showToast('📐 卡片比例已更新');
            });

            columnsSlider.addEventListener('input', () => {
                saveHistory();
                currentSizePreset = 'custom';
                sizePresetSelect.value = 'custom';
                updateLayout();
                autoSave();
            });
            gapSlider.addEventListener('input', () => { saveHistory();
                updateLayout();
                autoSave(); });
            rowWidthSlider.addEventListener('input', () => {
                saveHistory();
                currentSizePreset = 'custom';
                sizePresetSelect.value = 'custom';
                updateLayout();
                autoSave();
            });
            borderRadiusSlider.addEventListener('input', () => { saveHistory();
                updateLayout();
                autoSave(); });

            colorBg.addEventListener('input', () => applyCustomColor('bg', colorBg.value));
            colorCard.addEventListener('input', () => applyCustomColor('card', colorCard.value));
            colorText.addEventListener('input', () => applyCustomColor('text', colorText.value));
            colorAccent.addEventListener('input', () => applyCustomColor('accent', colorAccent.value));
            colorPrice.addEventListener('input', () => applyCustomColor('price', colorPrice.value));
            colorTitle.addEventListener('input', () => applyCustomColor('title', colorTitle.value));
            colorSubtitle.addEventListener('input', () => applyCustomColor('subtitle', colorSubtitle.value));

            bgOpacitySlider.addEventListener('input', () => updateBgOpacity(bgOpacitySlider.value));

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault();
                    exportImage('jpg'); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault();
                    addProduct(); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault();
                    undo(); }
                if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) { e.preventDefault();
                    redo(); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'p') { e.preventDefault();
                    printPoster(); }
            });

            // ==================== 初始化 ====================
            function init() {
                refreshTemplateSelect();
                const savedState = loadFromStorage();
                if (savedState) {
                    try {
                        historyLocked = true;
                        products = JSON.parse(JSON.stringify(savedState.products || DEFAULT_PRODUCTS));
                        nextId = savedState.nextId || 5;
                        currentTemplate = savedState.currentTemplate || 'monochrome';
                        currentSizePreset = savedState.currentSizePreset || 'custom';
                        columnCount = savedState.columnCount || 3;
                        cardGap = savedState.cardGap || 16;
                        rowWidth = savedState.rowWidth || 900;
                        cardRatio = savedState.cardRatio || 1;
                        cardBorderRadius = savedState.cardBorderRadius || 8;
                        customColors = Object.assign({}, savedState.customColors || {});
                        colorsOverridden = savedState.colorsOverridden || false;
                        bgImageDataUrl = savedState.bgImageDataUrl || null;
                        bgImageOpacity = savedState.bgImageOpacity || 0.15;
                        qrCodeData = Object.assign({}, savedState.qrCodeData || { url: '', label: '' });
                        if (savedState.titleText) posterTitle.textContent = savedState.titleText;
                        if (savedState.subtitleText) posterSubtitle.textContent = savedState.subtitleText;

                        sizePresetSelect.value = currentSizePreset;
                        cardRatioSelect.value = String(cardRatio);
                        columnsSlider.value = columnCount;
                        gapSlider.value = cardGap;
                        rowWidthSlider.value = rowWidth;
                        borderRadiusSlider.value = cardBorderRadius;
                        columnsValue.textContent = columnCount;
                        gapValue.textContent = cardGap;
                        rowWidthValue.textContent = rowWidth;
                        borderRadiusValue.textContent = cardBorderRadius;

                        if (currentTemplate.startsWith('custom_')) {
                            const ctName = currentTemplate.substring(7);
                            const customTemplates = loadCustomTemplates();
                            const ct = customTemplates.find(t => t.name === ctName);
                            if (ct) {
                                customColors = Object.assign({}, ct.colors);
                                colorsOverridden = true;
                                applyTemplateToDOM('monochrome', customColors, true);
                            } else {
                                currentTemplate = 'monochrome';
                                applyTemplateToDOM('monochrome', customColors, colorsOverridden);
                            }
                        } else if (TEMPLATES[currentTemplate]) {
                            applyTemplateToDOM(currentTemplate, customColors, colorsOverridden);
                        } else {
                            currentTemplate = 'monochrome';
                            applyTemplateToDOM('monochrome', customColors, colorsOverridden);
                        }

                        templateSelect.value = currentTemplate;
                        syncColorPickersToCustom();
                        updateLayout();
                        renderAllProducts();
                        if (bgImageDataUrl) applyBgImage();
                        else clearBgImageDOM();
                        if (qrCodeData.url) renderQrToPoster();

                        historyLocked = false;
                        updateUndoRedoButtons();
                        showToast('📂 已恢复上次编辑 | Ctrl+S导出 | Ctrl+Z/Y撤销');
                        return;
                    } catch (e) {
                        console.warn('恢复状态失败:', e);
                        historyLocked = false;
                    }
                }
                applyTemplate('monochrome', false);
                syncColorPickersToCustom();
                renderAllProducts();
                updateLayout();
                clearBgImageDOM();
                updateUndoRedoButtons();
                showToast('✨ 海报生成器就绪 | Ctrl+S导出 | Ctrl+P打印');
            }

            init();
        })();
    </script>
</body>
</html>
